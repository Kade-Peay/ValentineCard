<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        /* Ensure full height of the body */
        html, body {
            height: 100%;
            margin: 0;
        }
        .button-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        button {
            position: absolute;
        }
    </style>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create container for buttons to align side by side
            const container = document.createElement('div');
            container.className = 'button-container';
            document.body.appendChild(container);

            // create the GIF
            const gif = document.createElement('img');
            gif.src = 'media/beemine.gif';
            gif.style.display = 'block';
            gif.style.scale = .5;
            gif.style.margin = '0 auto';


            // Create the text
            const text = document.createElement('p');
            text.textContent = "Will you be my valentine?";
            text.style.textAlign = 'center';
            text.style.fontSize = 'large';
            

            // Create the "yes" button
            const yesButton = document.createElement('button');
            yesButton.textContent = 'YES';
            yesButton.style.top = '50%';
            yesButton.style.left = '40%';
            yesButton.addEventListener('click', function() {
                location.href = "yespage.html";
            });

            // Create the "no" button
            const noButton = document.createElement('button');
            noButton.textContent = 'NO';
            noButton.style.top = '50%';
            noButton.style.left = '50%';
            noButton.addEventListener('click', function() {
                // Get the container's dimensions
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;

                // Calculate random positions within the container
                const newX = Math.floor(Math.random() * (containerWidth - noButton.offsetWidth));
                const newY = Math.floor(Math.random() * (containerHeight - noButton.offsetHeight));

                // Apply the new positions
                noButton.style.left = `${newX}px`;
                noButton.style.top = `${newY}px`;

                // Have list of messages to display
                const messages = [
                    "Aww, why :(",
                    "That's too bad :(",
                    "Oh, okay :(",
                    "I didn't want to be your valentine anyway :(",
                    "Fine, I see how it is :(",
                    "You're missing out on a great valentine >:("
                ];
                // Pick a random message
                const message = messages[Math.floor(Math.random() * messages.length)];
                // Display message in text on page
                text.textContent = message;

                
            
            });

            // add both buttons to container 
            container.appendChild(text);
            container.appendChild(gif);
            container.appendChild(yesButton);
            container.appendChild(noButton);
        })
    </script>
</body>
</html>
